name: Sondeo de Cosmeshop

# Diagnóstico de una sola vez, a mano.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python herramientas/sondeo_cosmeshop.py
